version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "12345"
      POSTGRES_DB: prisma
    ports:
      - "5433:5432"  # Windows-dan 5433 orqali ulanasiz
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6378:6379"  # Windows-dan 6378 orqali ulanasiz

volumes:
  postgres_data: